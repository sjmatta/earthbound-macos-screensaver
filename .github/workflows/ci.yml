name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-14, macos-15, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Task
        run: brew install go-task

      - name: Build native screensaver
        run: task build

      - name: Test deterministic rendering and startup
        run: |
          npm test
          scripts/test-native.sh

      - name: Build preview app and experimental extension
        run: task build:studio

      - name: Verify universal architectures
        run: |
          lipo -verify_arch arm64 x86_64 dist/EarthboundScreensaver.saver/Contents/MacOS/EarthboundScreensaver
          lipo -verify_arch arm64 x86_64 dist/EarthboundStudio.app/Contents/MacOS/EarthboundStudio
          codesign --verify --strict --deep dist/EarthboundStudio.app

      - name: Verify build output
        run: |
          test -d dist/EarthboundScreensaver.saver
          test -f dist/EarthboundScreensaver.saver/Contents/MacOS/EarthboundScreensaver
          test -f dist/EarthboundScreensaver.saver/Contents/Resources/Resources/index.html
          test -f dist/EarthboundScreensaver.saver/Contents/Resources/Resources/screensaver.js

      # A Vite upgrade reintroducing type="module" blanks the screensaver with no
      # error of any kind, so assert it on the HTML that actually ships in the bundle.
      - name: Verify file:// compatibility of shipped bundle
        run: |
          HTML=dist/EarthboundScreensaver.saver/Contents/Resources/Resources/index.html
          if grep -qE 'type="module"|crossorigin' "$HTML"; then
            echo "ERROR: shipped index.html contains type=\"module\" or crossorigin."
            echo "Module scripts enforce CORS, which fails silently on file:// origins."
            grep -nE 'type="module"|crossorigin' "$HTML"
            exit 1
          fi
          grep -q '<script src="./screensaver.js"></script>' "$HTML"
          echo "OK: plain <script> tag, no CORS-enforcing attributes."

      - name: Check code signing
        run: codesign -vvv dist/EarthboundScreensaver.saver
